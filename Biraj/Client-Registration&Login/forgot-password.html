<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="forgot-password.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Forgot Password</h1>
        <p>Enter your registered mobile number and we'll send you an OTP to reset your password.</p>
        <div class="input">
            <form action="">
                <label for="login-mobile">Mobile Number</label>
                <div class="wrapper">
                    <span class="input-icon"><i class="bi bi-phone"></i></span>
                    <input type="tel" id="login-mobile" placeholder="Mobile Number" minlength="10" maxlength = "10" required>
                </div>
                <button type ="submit" class="submit">Send OTP</button>
            </form>
        </div>
        <img src="./Images/forget-password_img.png" alt="">
        <a href="login.html">Back To Login</a>
    </div>
</body>
</html>
