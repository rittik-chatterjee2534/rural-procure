<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
     <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

        <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"></link>

</head>
<body>
    <div class="container">
        <div class="left">
            <div class="heading">
                 <h1><span class="rural-txt">Rural</span><span class="procure-txt">Procure</span></h1>
            </div>
            <div class="login-details">
                <h1>Welcome Back!</h1>
                <p>Enter your login details to access your account</p>

                <form action="submit" class="login-field" id="login-submit">
                    <div class="mobile-number-field">
                        <label for="mobile-number">Mobile Number</label>
                        <div class="mobile-input">
                            <div class="phone-icon"><i class="bi bi-phone"></i></div>
                            <input type="tel" id="mobile-number" name="mobile-number" placeholder="Mobile Number" maxlength="10">
                        </div>
                    </div>

                    <div class="password-field">
                        <label for="password">Password</label>
                        <div class="password-input">
                            <div class="lock-icon"><i class="bi bi-lock" id="lock"></i></div>
                            <input type="password" id="password" name="password" placeholder="Password" maxlength="10">
                            <div class="eye-icon"><i class="bi bi-eye-slash password-toggle" id="eye"></i></div>
                        </div>
                        <a href="#">Forgot Password</a>
                    </div>
                </form>
                <div class="remember-me">
                    <input type="checkbox"><span>Remember Me</span>
                </div>
                <button type="submit" form="login-submit">Login</button>

                <div class="login-footer">
                    <span>New User? <a href="">Register Now</a></span>
                    <a href="">Create An Account</a>
                </div>
            </div>
        </div>
        <div class="right">
            <div class="text">
                <h1>Smart Procurement</h1>
                <h1>for <span>Happy Farmers</span></h1>
                <hr><br>
                <p>Smart Procurement for happy farmers</p>
            </div>
            <img src="./Images/Login-image.jpg" alt="" srcset="">
        </div>
    </div>
</body>
</html>
